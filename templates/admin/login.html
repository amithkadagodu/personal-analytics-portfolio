{% extends "base.html" %}
{% block content %}



<section style="padding-top: 80px; " class="d-flex justify-content-center">


<div class="card text-center mb-3 rounded-5 d-flex flex-column justify-content-center" style="width: 500px; height: 600px; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15); ">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for msg_lst in messages %}
                {%if msg_lst[0]=="login"%}
                <section id="success-message" class="d-flex justify-content-center p-3">
                    <div class="vjr rounded-4 p-2">
                        {{ msg_lst[1] }}
                    </div>
                </section>
                {% endif %}
            {% endfor %}
        {% endif %}
    {% endwith %}


    <form method="post" action="{{ url_for('login') }}" onsubmit="return confirm('Are you sure you want to submit these details?');">
        <div class="card-body d-flex flex-column justify-content-center gap-5">


            <div><svg class="text-color" xmlns="http://www.w3.org/2000/svg" width="100px" height="100px" fill="currentColor" class="bi bi-house-lock-fill" viewBox="0 0 16 16"><path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/><path d="m8 3.293 4.72 4.72a3 3 0 0 0-2.709 3.248A2 2 0 0 0 9 13v2H3.5A1.5 1.5 0 0 1 2 13.5V9.293z"/><path d="M13 9a2 2 0 0 0-2 2v1a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1v-1a2 2 0 0 0-2-2m0 1a1 1 0 0 1 1 1v1h-2v-1a1 1 0 0 1 1-1"/></svg></div>


            <div class="d-flex justify-content-center gap-3"><label class="vjr rounded-4 p-2" for="username">Username</label><input style="width: 500px;" class="git rounded-4 p-2" type="text" name="username" id="un"></div>
    
            <div class="d-flex justify-content-center gap-3"><label class="vjr rounded-4 p-2" for="password">Password</label><input style="width: 500px;" class="git rounded-4 p-2" type="password" name="password" id="pw"></div>

            <div class="d-flex justify-content-center"><button style="width: 100px;" class="vjr rounded-4 p-2" type="submit"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-in-right" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0z"/><path fill-rule="evenodd" d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/></svg><div>Login</div></button></div>
        </div>
    </form>
</div>

</section>












{% endblock %}
